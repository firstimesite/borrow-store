<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>طلب إعارة المنتجات</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">📋 طلب إعارة المنتجات</h2>

    <div class="alert alert-info">

        <h5>المنتجات المطلوبة:</h5>

        <ul id="selectedProducts"></ul>

    </div>

    <form id="borrowForm">

        <div class="mb-3">

            <label class="form-label">الاسم</label>

            <input
                type="text"
                class="form-control"
                id="name"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">رقم الجوال</label>

            <input
                type="tel"
                class="form-control"
                id="phone"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">مدة الإعارة (بالأيام)</label>

            <input
                type="number"
                class="form-control"
                id="days"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">ملاحظات</label>

            <textarea
                class="form-control"
                id="notes"></textarea>

        </div>

        <button
            type="submit"
            class="btn btn-success">

            إرسال الطلب

        </button>

    </form>

</div>

<script>

const cart = JSON.parse(localStorage.getItem("cart")) || [];

fetch("data/products.json")
.then(response => response.json())
.then(products => {

    const list = document.getElementById("selectedProducts");

    const selectedProducts = products.filter(product =>
        cart.includes(product.id)
    );

    if (selectedProducts.length === 0) {

        list.innerHTML = "<li>لا توجد منتجات في السلة</li>";

    } else {

        selectedProducts.forEach(product => {

            list.innerHTML += `
                <li>${product.name}</li>
            `;

        });

    }

});

document.getElementById("borrowForm").addEventListener("submit", function(e){

    e.preventDefault();

    fetch("data/products.json")
    .then(response => response.json())
    .then(products => {

        const productNames = products
            .filter(product => cart.includes(product.id))
            .map(product => product.name)
            .join("، ");

        return fetch(
            "https://script.google.com/macros/s/AKfycbx-SSXmvxOEkX2vRhZxZx6f2OyebuTVMICws0ftNzKGV3pnMnN8f7jAxuo8Bn4ok7BNiw/exec",
            {

                method: "POST",

                body: JSON.stringify({

                    name: document.getElementById("name").value,

                    phone: document.getElementById("phone").value,

                    products: productNames,

                    days: document.getElementById("days").value,

                    notes: document.getElementById("notes").value

                })

            }

        );

    })

    .then(() => {

        alert("تم إرسال الطلب بنجاح");

        localStorage.removeItem("cart");

        window.location.href = "index.html";

    });

});

</script>

</body>

</html>

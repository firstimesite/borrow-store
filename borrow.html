<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلب إعارة</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2 class="mb-4">📋 طلب إعارة المنتجات</h2>

<form id="borrowForm">

<div class="mb-3">
<label class="form-label">الاسم</label>
<input type="text" class="form-control" id="name" required>
</div>

<div class="mb-3">
<label class="form-label">رقم الجوال</label>
<input type="tel" class="form-control" id="phone" required>
</div>

<div class="mb-3">
<label class="form-label">مدة الإعارة (بالأيام)</label>
<input type="number" class="form-control" id="days" required>
</div>

<div class="mb-3">
<label class="form-label">ملاحظات</label>
<textarea class="form-control" id="notes"></textarea>
</div>

<button type="submit" class="btn btn-success">
إرسال الطلب
</button>

</form>

</div>

<script>

document.getElementById("borrowForm").addEventListener("submit", function(e){

    e.preventDefault();

    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    fetch("data/products.json")
    .then(response => response.json())
    .then(products => {

        const productNames = products
            .filter(product => cart.includes(product.id))
            .map(product => product.name)
            .join("، ");

        return fetch("https://script.google.com/macros/s/AKfycbx-SSXmvxOEkX2vRhZxZx6f2OyebuTVMICws0ftNzKGV3pnMnN8f7jAxuo8Bn4ok7BNiw/exec",{

            method:"POST",

            body:JSON.stringify({

                name:document.getElementById("name").value,
                phone:document.getElementById("phone").value,
                products:productNames,
                days:document.getElementById("days").value,
                notes:document.getElementById("notes").value

            })

        });

    })

    .then(function(){

        alert("تم إرسال طلب الإعارة بنجاح");

        localStorage.removeItem("cart");

        document.getElementById("borrowForm").reset();

        window.location.href = "index.html";

    })

    .catch(function(error){

        console.error(error);

        alert("حدث خطأ أثناء الإرسال");

    });

});

</script>

</body>
</html>
